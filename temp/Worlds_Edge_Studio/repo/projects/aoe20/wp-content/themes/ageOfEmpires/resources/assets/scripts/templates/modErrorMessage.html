Mod Error Message
<div class="alert">
  <div class="alert__content">
    <div class="alert__message">
      <h4 class="alert__title">Sorry!</h4>
      <p class="alert__desc">
        <% if (message) { %>
          <%= message %>
        <% 
        } else { 
        %>
          Something has gone wrong. Please try again later.
        <% } %>
      </p>
    </div>
  </div>
</div>
