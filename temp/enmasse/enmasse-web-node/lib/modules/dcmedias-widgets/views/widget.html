{% for piece in data.widget._pieces %}

	{% if piece.mediaimgpath %}

		{% if piece.mediavid %}
		<div class="vid_wrap wrap" data-mediaslide="media_slide_{{ loop.index + 2 }}">
		  <div class="wrapper">
		    <img src="{{ piece.mediaimgpath }}"  data-videoid="{{ piece.mediavid }}" alt="media" />
		  </div>
		  <div class="action">
		    <span>Play</span>
		  </div>
		</div>
		{% else %}
		<div class="vid_wrap wrap" data-mediaslide="media_slide_{{ loop.index + 2 }}">
		  <div class="wrapper">
		    <img src="{{ piece.mediaimgpath }}" alt="media" />
		  </div>
		  <div class="action">
		    <span>Play</span>
		  </div>
		</div>
		{% endif %}

	{% endif %}

{% endfor %}
