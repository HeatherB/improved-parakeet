{% for piece in data.widget._pieces %}
<!--<div class="inner">-->

  {% if piece.youtubepath %}
  <div class="video-hero">
    <iframe width="560" height="315" src="{{ piece.youtubepath }}" frameborder="0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
  </div>
  {% endif %}
	
	{% if piece.videopath %}
	<video playsinline autoplay muted loop id="bgvid"><source src="{{ piece.videopath }}" type="video/mp4"></video>
	{% endif %}
           <!--<img src="https://eme04.enmasse-game.com/images/enm/hero/fishing2.jpg" alt="fishing two" /> -->
           <!-- <video playsinline autoplay muted loop poster="https://eme02.enmasse-game.com/images/closers/bai/bgs/hero_out.jpg" id="bgvid"><source src="//eme02.enmasse-game.com/images/closers/bai/video/Background_video.mp4" type="video/mp4"><source src="//eme02.enmasse-game.com/images/closers/bai/video/Background_video.webm" type="video/webm"></video>-->
    <div class="copy_wrap">
    	{% if piece.headline %}
              <h1>{{ piece.headline }}</h1>
        {% endif %}
        {% if piece.bodycopy %}
        	<p>{{ piece.bodycopy }}</p>
        {% endif %}
    </div> <!-- end of copy wrap -->
<!--</div>-->
{% endfor %}
