<div class="verify_choice_pop">
	<p>Are you sure your issue is resolved?</p>
	<p class="extra-sure">You are about to close this ticket.</p>
	<button type="button" id="do-close-ticket" class="button-large">
		<span>Yes, close my ticket</span>
	</button>
	<button id="dont-close-ticket" class="button-large">
		<span>No, do not close my ticket</span>
	</button>
</div>

<style>
	.comment-form-controls {
		position: relative;
	}
	.verify_choice_pop {
		display: none;
	}
	.comment-form-controls.doublecheck .request-submit-comment,
	.comment-form-controls.doublecheck .button-secondary {
			display: none !important;
	}
	.comment-form-controls.doublecheck .verify_choice_pop {
		display: block;
	}
	.verify_choice_pop p {
		margin-top:0;
		margin-bottom:0;
	}
	.verify_choice_pop p.extra-sure {
		font-weight:bold;
		color: red;
	}
	.verify_choice_pop .button-large#do-close-ticket {
		font-size:14px;
		margin-top: 15px;
	}
	.verify_choice_pop .button-large#dont-close-ticket {
		font-size:14px;
		margin-left: 20px;
		background: #09265b;
		margin-top: 15px;
	}
</style>

<script>

	doublecheckYESButton = document.getElementById('do-close-ticket'),
	doublecheckNOButton = document.getElementById('dont-close-ticket'),
	commentFormCtrl = document.querySelector('.comment-form-controls');


	commentFormCtrl.classList.add('doublecheck');

	$('#dont-close-ticket').on('click', function() {
		$('.comment-form-controls').removeClass('doublecheck')
	});
	$('#do-close-ticket').on('click', function() {
		closest(this, 'form').submit();
	});
